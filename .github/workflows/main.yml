name: TWRP CI
on:
  workflow_dispatch:
jobs:
  build:
    name: TWRP Build CI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Installing build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python2.7 openjdk-8-jdk
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac
          sudo ln -f -s /usr/bin/python2.7 /usr/bin/python
      - name: Syncing TWRP sources
        run: |
          mkdir ~/OFRP
          cd ~/OFRP
          mkdir ~/.bin
          curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          python3 ~/.bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-7.1
          mkdir -p .repo/local_manifests
          echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/local_manifest.xml
          echo '<manifest>' >> .repo/local_manifests/local_manifest.xml
          echo '  <project name="NotNoelChannel/twrp_device_samsung_matissewifi" path="device/samsung/matissewifi" remote="github" revision="twrp-6.0" />' >> .repo/local_manifests/local_manifest.xml
          echo '  <project name="matteo0026/android_kernel_samsung_msm8226" path="kernel/samsung/msm8226" remote="github" revision="android-7.1" />' >> .repo/local_manifests/local_manifest.xml
          echo '</manifest>' >> .repo/local_manifests/local_manifest.xml
          python3 ~/.bin/repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
          rm -rf prebuilts/misc
          git clone https://github.com/LineageOS/android_prebuilts_misc.git -b cm-14.1 prebuilts/misc
          git clone --depth=1 --branch android-6.0.1_r32 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 /opt/toolchains/arm-eabi-4.8
      - name: Building TWRP
        run: |
          OLDPATH=$PATH
          OLDJAVAHOME=$JAVA_HOME
          export PATH="$HOME/.jdk_7/java-se-7u75-ri/bin:$PATH"
          export JAVA_HOME="$HOME/.jdk_7/java-se-7u75-ri"
          cd ~/OFRP
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export CROSS_COMPILE=/opt/toolchains/arm-eabi-4.8/bin/arm-eabi-
          lunch omni_matissewifi-eng
          make -j$(nproc --all) recoveryimage
          export PATH=$OLDPATH
          export JAVA_HOME=$OLDJAVAHOME
      - name: Uploading TWRP builds
        uses: actions/upload-artifact@v4
        with:
          name: twrp
          path: /home/runner/OFRP/out/target/product/matissewifi/recovery.*
